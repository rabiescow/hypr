# config

general {
    border_size = 2
    # no_border_on_floating = false

    gaps_in = 5
    gaps_out = 10
    float_gaps = 5
    gaps_workspaces = 0

    col.active_border = 0xFFFAB387 0xFFA6E3A1 45deg
    col.inactive_border = 0x99585B70 0x99B4BEFE 45deg
    col.nogroup_border = 0x99585B70 0x99B4BEFE 45deg
    col.nogroup_border_active = 0x99585B70 0x99B4BEFE 45deg

    layout = slidr
    no_focus_fallback = false
    resize_on_border = false
    extend_border_grab_area = 15
    hover_icon_on_border = true
    allow_tearing = false
    resize_corner = 0

    modal_parent_blocking = true
    locale = en_US

    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
        border_overlap = false
        respect_gaps = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
 
    dim_modal = true
    dim_inactive = true
    dim_strength = 0.05
    dim_special = 0.2
    dim_around = 0.4

    screen_shader =
    border_part_of_window = true

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 1
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        xray = true
        noise = 0.0117
        contrast = 0.9
        brightness = 0.4
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        special = false
        popups = false
        popups_ignorealpha = 0.2
        input_methods = false
        input_methods_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 10
        render_power = 9
        sharp = false
        # ignore_window = true
        color = rgba(11111bee)
        color_inactive = rgba(181825ee)
        offset = 5, 5
        scale = 1.0
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true
    workspace_wraparound = true
    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.0,0.0,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = easeOutCubic,0.1,0.3,0.1,0.9
    bezier = easeInCubic,0.6,0.1,0.7,0.2
    bezier = easeInBack,0.6,-0.3,0.75,0.1

    animation = global, 1, 10, default
    animation = border, 1, 3, easeInBack
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fadeSwitch, 1, 1.91, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, easeOutCubic, fade
    animation = workspacesIn, 1, 1.21, easeOutCubic, fade
    animation = workspacesOut, 1, 1.94, easeOutCubic, fade
}


