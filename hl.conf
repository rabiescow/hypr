# File dialogs
windowrule {
  name = windowrule-7
  move = ((monitor_w*0.2)) ((monitor_h*0.2))
  size = (monitor_w*0.4) (monitor_h*0.6)
  float = on
  keep_aspect_ratio = on
  border_size = 3
  tag = file_dialog
  opacity = 1.0 0.9
  match:class = xdg-desktop-portal-gtk
}

windowrule {
  name = windowrule-8
  move = ((monitor_w*0.2)) ((monitor_h*0.2))
  size = (monitor_w*0.4) (monitor_h*0.6)
  float = on
  keep_aspect_ratio = on
  border_size = 3
  tag = file_dialog
  opacity = 1.0 0.9
  match:title = ^(.*)(((A|a)ll (F|f)ile)|((O|o)pen (F|f)ile)|((S|s)elect) (F|f)ile|((A|a)ll) (F|f)iles)(.*)$
}

windowrule {
  name = windowrule-09
  move = ((monitor_w*0.2)) ((monitor_h*0.2))
  size = (monitor_w*0.4) (monitor_h*0.6)
  float = on
  keep_aspect_ratio = on
  border_size = 3
  tag = file_dialog
  opacity = 1.0 0.9
  match:title = "All Files"
}


