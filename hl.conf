# Variables
$HOME = /home/anon
$TERMINAL = kitty
$FILEMANAGER = nautilus
$MENU = hyprlauncher

# XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_MENU_PREFIX,arch-

# Themes
env = XCURSOR_SIZE,40
env = XCUSROR_PATH,/home/anon/.local/share/icons/
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,40

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland

# Qt
env = QT_AUTO_SCREEN_SCALE_FACTOR,2
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# Firefox
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1

# Java
env = _JAVA_AWT_WM_NONREPARENTING=1

env = WLR_NO_HARDWARE_CURSORS,1
env = EDITOR,nvim
env = TERM,xterm-ghostty

monitor=HDMI-A-1,3440x1440@100,0x0,1

# Startup

# personal software
exec-once = wbg --stretch ~/Pictures/wallpapers/takashi-miyazaki-unsplash.jpg
exec-once = nwg-panel
exec-once = dunst

# gaming
exec-once = steam
# exec-once = lutris

# enables copypaste
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data

# setting up environment
exec-once = otd-daemon
exec-once = eww daemon
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/keyboard.sh
exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = xembedsniproxy

# Environment for xdg-desktop-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent


